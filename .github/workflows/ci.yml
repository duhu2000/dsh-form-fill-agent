name: local-m1-draft
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
  # Cross-repository consumer job will be enabled only after the compatibility
  # branch / repository ownership is approved. Locally: npm run test:consumer.
  # No publishing job, token or id-token permission is configured.
